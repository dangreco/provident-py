[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "provident"
version = "0.1.4"
description = "Python client library for the Provident (MeterConnex) API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Dan Greco", email = "dangreco@users.noreply.github.com" }]
keywords = ["provident", "meterconnex", "hydro", "utility", "energy", "ontario"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27", "pydantic>=2.0"]

[project.urls]
Repository = "https://github.com/dangreco/provident-py"
Issues = "https://github.com/dangreco/provident-py/issues"

[dependency-groups]
dev = ["ty>=0.0.1", "pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.hatch.build.targets.wheel]
packages = ["src/provident"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
